        <style>
            :root {
                --surface-primary: #f26b37;
                --surface-default: #ffffff;
                --surface-soft: #f4f6fa;
                --surface-contrast: #262626;
                --border-dark: #c6cbd8;
                --typography-primary: #414043;
                --typography-secondary: #7f7e80;
                --typography-highlighted: #f26b37;
                --typography-white: #fbfcfd;
                --titulo: #334155;
                --subtitulo: #64748b;
                --laranja-forte: #ff4a10;
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .hidden { display: none !important; }
            .staticrypt-content {
                height: 100%; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-default);
                font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif; color: var(--typography-primary);
                -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-content.hidden { display: none !important; }
            /* coluna do formulário */
            .lg-form { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 112px; min-height: 100%; box-sizing: border-box; }
            .lg-bloco { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 48px; }
            .lg-logo { display: flex; justify-content: center; }
            .lg-logo img { height: 32px; width: auto; }
            .lg-textos { display: flex; flex-direction: column; gap: 16px; }
            .staticrypt-title { margin: 0; font-size: 20px; line-height: 24px; font-weight: 700; color: var(--titulo); }
            .staticrypt-instructions p { margin: 0; }
            .lg-sub { font-size: 16px; line-height: 20px; color: var(--subtitulo); }
            .lg-campos { display: flex; flex-direction: column; gap: 16px; }
            .lg-campo { display: flex; flex-direction: column; gap: 4px; }
            .lg-campo label { font-size: 14px; line-height: 16px; color: var(--typography-secondary); }
            .staticrypt-password-container {
                position: relative; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px;
                background: var(--surface-default); border: 1px solid var(--border-dark); border-radius: 8px; box-sizing: border-box;
            }
            .staticrypt-password-container:focus-within { border-color: var(--surface-primary); box-shadow: 0 0 0 3px rgba(242, 107, 55, 0.18); }
            .lg-icone { flex: none; width: 16px; height: 16px; color: var(--typography-secondary); }
            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; height: 100%;
                font: inherit; font-size: 14px; color: var(--typography-primary);
            }
            .staticrypt-password-container input::placeholder { color: var(--typography-secondary); font-size: 13px; }
            .staticrypt-toggle-password-visibility { flex: none; width: 16px; height: 16px; cursor: pointer; opacity: 0.6; }
            .staticrypt-toggle-password-visibility:hover { opacity: 1; }
            .lg-linha { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; color: var(--typography-primary); cursor: pointer; }
            .staticrypt-remember input[type="checkbox"] {
                appearance: none; -webkit-appearance: none; transform: none; margin: 0; width: 20px; height: 20px; border-radius: 4px; cursor: pointer;
                background: var(--surface-soft); border: 1px solid var(--border-dark); display: grid; place-items: center;
            }
            .staticrypt-remember input[type="checkbox"]:checked { background: var(--surface-primary); border-color: var(--surface-primary); }
            .staticrypt-remember input[type="checkbox"]:checked::after {
                content: ""; width: 10px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg);
            }
            .lg-botao-area { padding-top: 16px; }
            .staticrypt-form .staticrypt-decrypt-button {
                display: block; width: 100%; height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--surface-primary);
                background: var(--surface-primary) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23fbfcfd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12h16M14 6l6 6-6 6'/></svg>") no-repeat calc(50% + 44px) 50% / 24px 24px;
                color: var(--typography-white); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: none;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover, .staticrypt-form .staticrypt-decrypt-button:focus { filter: brightness(94%); }
            .lg-rodape { position: absolute; left: 0; right: 0; bottom: 32px; padding: 0 32px; text-align: center; font-size: 11px; color: var(--typography-secondary); }
            /* painel da direita */
            .lg-painel { position: relative; overflow: hidden; color: #fff; background: #1c2540 url(/login-bg.jpg) center / cover no-repeat; }
            .lg-painel::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 24, 40, 0.55) 0%, rgba(20, 24, 40, 0.25) 45%, rgba(20, 24, 40, 0.7) 100%); }
            .lg-credito { position: absolute; z-index: 2; right: 16px; bottom: calc(9% + 8px); font-size: 11px; color: rgba(255, 255, 255, 0.75); }
            .lg-faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 9%; background: var(--surface-primary); z-index: 1; }
            .lg-mensagem { position: absolute; z-index: 2; left: 48px; right: 48px; top: auto; bottom: calc(9% + 56px); text-align: left; font-family: "Ubuntu", "Source Sans 3", sans-serif; font-size: clamp(28px, 3.1vw, 44px); line-height: 1.2; font-weight: 400; color: #fff; }
            .lg-mensagem strong { display: block; font-weight: 700; color: var(--surface-primary); }
            .lg-mensagem span { display: block; margin-top: 16px; font-size: 0.45em; font-weight: 400; color: rgba(255, 255, 255, 0.85); }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { display: inline-block; width: 2rem; height: 2rem; border: 0.25em solid #c6cbd8; border-top-color: var(--surface-primary); border-radius: 50%; animation: spinner-border 0.75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media (max-width: 900px) {
                .staticrypt-content { grid-template-columns: 1fr; }
                .lg-painel { display: none; }
                .lg-form { padding: 0 24px; }
            }
        </style>

                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
